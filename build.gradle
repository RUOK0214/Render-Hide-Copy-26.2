plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        renderhide {
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "maven.modrinth:sodium:mc26.2-0.9.1-fabric"
}

tasks.withType(ProcessResources).configureEach {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('inspectBlockEntityRenderApi', Exec) {
    dependsOn tasks.named('compileClientJava')
    commandLine "${System.getProperty('java.home')}/bin/javap", '-p', '-c',
        '-classpath', sourceSets.client.compileClasspath.asPath,
        'net.minecraft.client.renderer.blockentity.BlockEntityRenderDispatcher',
        'net.minecraft.client.renderer.blockentity.state.BlockEntityRenderState',
        'net.minecraft.client.renderer.blockentity.BlockEntityRenderer',
        'net.minecraft.client.renderer.blockentity.ChestRenderer'
}
tasks.named('build') { dependsOn 'inspectBlockEntityRenderApi' }
